<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turkey 2026 · Cecilia's Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --sand: #F5EDD8;
  --terracotta: #C4623A;
  --deep: #1A1208;
  --gold: #D4A853;
  --teal: #2E7D7A;
  --cream: #FAF6EE;
  --muted: #8B7355;
  --border: rgba(196,98,58,0.15);
  --sidebar-w: 360px;
  --sheet-peek: 100px; /* how much of bottom sheet peeks above fold on mobile */
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; background: var(--deep); color: var(--deep); }

/* ── HEADER ── */
.header {
  background: var(--deep); color: var(--sand);
  padding: 11px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: relative; z-index: 200;
  border-bottom: 1px solid rgba(196,98,58,0.2);
  flex-shrink: 0;
}
.header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 50%, rgba(196,98,58,0.18) 0%, transparent 60%);
  pointer-events: none;
}
.header-left { display: flex; align-items: center; gap: 10px; position: relative; }
.header-flag { font-size: 20px; line-height: 1; }
.header-title { font-family: 'Playfair Display', serif; font-size: 16px; line-height: 1; }
.header-title em { font-style: italic; color: var(--terracotta); }
.header-sub { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 8px; position: relative; }

.lang-toggle { display:flex; gap:4px; }
.lang-btn {
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  border: 1px solid rgba(196,98,58,0.4); background: transparent;
  color: var(--sand); cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.lang-btn.active { background: var(--terracotta); border-color: var(--terracotta); color: var(--sand); }
.lang-btn:hover:not(.active) { background: rgba(196,98,58,0.2); }

/* ── DESKTOP LAYOUT ── */
.app { display: flex; flex-direction: column; height: 100vh; }
.main { display: grid; grid-template-columns: var(--sidebar-w) 1fr; flex: 1; overflow: hidden; min-height: 0; }

/* ── SIDEBAR (desktop) ── */
.sidebar {
  background: var(--cream); display: flex; flex-direction: column;
  overflow: hidden; border-right: 1px solid var(--border);
}
.sidebar-header {
  padding: 13px 18px 11px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--sand);
}
.sidebar-header h2 { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 400; }
.sidebar-header p { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.days-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.days-scroll::-webkit-scrollbar { width: 3px; }
.days-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── MAP ── */
.map-wrap { position: relative; }
#map { width: 100%; height: 100%; }

/* ── DAY CARDS ── */
.day-card { border-bottom: 1px solid var(--border); transition: background 0.15s; }
.day-card.active { background: rgba(196,98,58,0.05); }

.day-header {
  padding: 12px 18px;
  display: flex; align-items: flex-start; gap: 12px;
  cursor: pointer; user-select: none; touch-action: manipulation;
}
.day-header:hover { background: rgba(196,98,58,0.04); }
.day-header:active { background: rgba(196,98,58,0.1); }

.day-num {
  min-width: 40px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; line-height: 1.1; flex-shrink: 0;
}
.day-num .label { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }
.day-num .n { font-size: 16px; font-family: 'DM Mono', monospace; }

.day-info { flex: 1; min-width: 0; }
.day-info h3 { font-size: 13px; font-weight: 600; line-height: 1.3; }
.day-info .date { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 1px; }
.day-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.city-tag {
  display: inline-block; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 2px 7px; border-radius: 20px; font-weight: 600;
}

/* ── WEATHER BADGE ── */
.weather-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; padding: 2px 7px; border-radius: 20px;
  background: rgba(212,168,83,0.12); border: 1px solid rgba(212,168,83,0.25);
  color: #8B6914; font-weight: 500; white-space: nowrap;
}
.weather-badge .wi { font-size: 12px; }

.day-chevron { font-size: 11px; color: var(--muted); margin-top: 13px; flex-shrink: 0; transition: transform 0.2s; }
.day-card.active .day-chevron { transform: rotate(180deg); }

/* ── FLIGHT BADGE ── */
.flight-badge {
  margin: 0 18px 10px;
  padding: 7px 11px; border-radius: 7px;
  background: rgba(46,125,122,0.08); border: 1px solid rgba(46,125,122,0.18);
  font-size: 10px; color: var(--teal); font-family: 'DM Mono', monospace; line-height: 1.6;
}

/* ── STOPS LIST ── */
.stops-list { padding: 0 18px 12px; display: none; }
.day-card.active .stops-list { display: block; }

.stop-item {
  display: flex; gap: 10px;
  padding: 10px 6px 10px 4px;
  border-bottom: 1px dashed rgba(139,115,85,0.15);
  border-radius: 6px;
}
.stop-item:last-child { border-bottom: none; }

.stop-timeline {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 3px; flex-shrink: 0; width: 14px;
}
.stop-dot-outer {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid; background: white; flex-shrink: 0;
}
.stop-line { width: 1px; flex: 1; min-height: 10px; opacity: 0.15; margin-top: 2px; }

.stop-content { flex: 1; min-width: 0; }
.stop-name { font-size: 13px; font-weight: 600; color: var(--deep); line-height: 1.3; }
.stop-time { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 1px; }
.stop-note { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.stop-name.hotel { color: var(--teal); }
.stop-item.hotel-stop .stop-dot-outer { background: var(--teal) !important; border-color: var(--teal) !important; }
.stop-item.optional-stop { opacity: 0.75; }
.optional-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); background: rgba(139,115,85,0.1);
  border: 1px dashed rgba(139,115,85,0.3);
  border-radius: 4px; padding: 2px 6px; margin-top: 4px; font-weight: 600;
}
.stop-warn {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; color: #B85C00;
  background: rgba(196,98,58,0.1); border-radius: 4px;
  padding: 2px 6px; margin-top: 4px; font-weight: 500;
}

/* ── LINKS ROW ── */
.stop-links { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.stop-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500;
  padding: 5px 11px; border-radius: 20px;
  text-decoration: none; border: 1px solid;
  transition: opacity 0.15s; cursor: pointer; white-space: nowrap;
  touch-action: manipulation;
}
.stop-link:hover { opacity: 0.7; }
.stop-link.maps { color: #1A73E8; border-color: rgba(26,115,232,0.25); background: rgba(26,115,232,0.06); }
.stop-link.book { color: var(--teal); border-color: rgba(46,125,122,0.25); background: rgba(46,125,122,0.06); }
.stop-link.info { color: var(--muted); border-color: rgba(139,115,85,0.25); background: rgba(139,115,85,0.06); }

/* ── ADD STOP ── */
.add-stop-btn {
  display: flex; align-items: center; gap: 6px;
  margin: 8px 0 12px;
  padding: 10px 14px; border-radius: 10px;
  border: 1px dashed rgba(196,98,58,0.35);
  background: transparent; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--terracotta);
  font-family: 'DM Sans', sans-serif;
  transition: background 0.15s; width: 100%;
  touch-action: manipulation;
}
.add-stop-btn:hover, .add-stop-btn:active { background: rgba(196,98,58,0.07); }

.add-stop-form { margin: 0 0 12px; display: none; flex-direction: column; gap: 8px; }
.add-stop-form.open { display: flex; }
.add-stop-input-row { display: flex; gap: 6px; }
.add-stop-input {
  flex: 1; padding: 10px 13px; border-radius: 10px;
  border: 1px solid rgba(196,98,58,0.25);
  background: white; font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--deep); outline: none;
  -webkit-appearance: none;
}
.add-stop-input:focus { border-color: var(--terracotta); }
.add-stop-submit {
  padding: 10px 15px; border-radius: 10px;
  background: var(--terracotta); color: white;
  border: none; cursor: pointer; font-size: 13px;
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  white-space: nowrap; transition: opacity 0.15s;
  touch-action: manipulation;
}
.add-stop-submit:hover { opacity: 0.85; }
.add-stop-cancel {
  padding: 10px 12px; border-radius: 10px;
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); cursor: pointer;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  touch-action: manipulation;
}
.add-stop-status { font-size: 12px; padding: 0 2px; min-height: 16px; color: var(--muted); }
.add-stop-status.success { color: var(--teal); }
.add-stop-status.error { color: var(--terracotta); }
.add-stop-coords-row {
  margin-top: 8px; padding-top: 10px;
  border-top: 1px dashed rgba(196,98,58,0.15);
}
.not-found-guide {
  background: rgba(212,168,83,0.07);
  border: 1px solid rgba(212,168,83,0.22);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
}
.not-found-title {
  font-size: 11px; font-weight: 600; color: var(--deep);
  margin-bottom: 8px;
}
.not-found-options { display: flex; flex-direction: column; gap: 6px; }
.not-found-opt {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 11px; color: var(--muted); line-height: 1.45;
}
.not-found-opt-letter {
  flex-shrink: 0; width: 17px; height: 17px;
  background: var(--terracotta); color: white;
  border-radius: 50%; font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}
@media (max-width: 768px) {
  .not-found-title { font-size: 12px; }
  .not-found-opt { font-size: 12px; }
  .not-found-opt-letter { width: 19px; height: 19px; font-size: 10px; }
}

/* ── CUSTOM STOP ITEMS ── */
.custom-stop-item {
  border-bottom: 1px dashed rgba(139,115,85,0.15);
  padding: 10px 6px 10px 4px;
  display: flex; gap: 10px;
  cursor: grab; user-select: none;
  transition: background 0.1s, opacity 0.15s;
  border-radius: 6px;
}
.custom-stop-item:active { cursor: grabbing; }
.custom-stop-item.dragging { opacity: 0.4; }
.custom-stop-item.drag-over { background: rgba(123,94,167,0.06); }
.custom-stop-item:last-of-type { border-bottom: none; }

.drag-handle {
  color: var(--muted); opacity: 0.35; font-size: 15px;
  cursor: grab; padding: 2px 0; flex-shrink: 0;
  display: flex; align-items: flex-start; padding-top: 4px;
  touch-action: none;
}
.custom-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  color: #7B5EA7; background: rgba(123,94,167,0.1);
  border: 1px solid rgba(123,94,167,0.2);
  border-radius: 4px; padding: 2px 6px; margin-top: 3px; font-weight: 600;
}
.custom-stop-delete, .stop-delete-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 18px; padding: 0 4px;
  opacity: 0.4; transition: opacity 0.15s; flex-shrink: 0;
  align-self: flex-start; margin-top: -1px;
  touch-action: manipulation; min-width: 32px; min-height: 32px;
  display: flex; align-items: center; justify-content: center;
}
.custom-stop-delete:hover, .stop-delete-btn:hover { opacity: 1; color: var(--terracotta); }

.drag-placeholder { pointer-events: none; }
body.is-dragging { user-select: none; cursor: grabbing !important; }
body.is-dragging * { cursor: grabbing !important; }

/* ── MAP LEGEND ── */
.map-legend {
  position: absolute; bottom: 20px; left: 10px; z-index: 400;
  background: rgba(26,18,8,0.88); backdrop-filter: blur(8px);
  padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(196,98,58,0.2);
  pointer-events: none;
}
.legend-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--sand); margin-bottom: 3px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── POPUP ── */
.leaflet-popup-content-wrapper {
  background: var(--deep); color: var(--sand);
  border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  border: 1px solid rgba(196,98,58,0.3); font-family: 'DM Sans', sans-serif;
}
.leaflet-popup-tip { background: var(--deep); }
.leaflet-popup-content { margin: 13px 16px; }
.popup-title { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--gold); margin-bottom: 3px; }
.popup-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--terracotta); margin-bottom: 6px; }
.popup-note { font-size: 11px; color: rgba(245,237,216,0.75); line-height: 1.5; max-width: 220px; margin-bottom: 8px; }
.popup-links { display: flex; gap: 6px; flex-wrap: wrap; }
.popup-link {
  font-size: 11px; padding: 5px 11px; border-radius: 20px;
  text-decoration: none; font-weight: 500;
  border: 1px solid rgba(255,255,255,0.15); color: var(--sand);
  background: rgba(255,255,255,0.08);
  display: inline-flex; align-items: center; gap: 4px;
}
.popup-link:hover { background: rgba(255,255,255,0.14); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.day-card { animation: fadeUp 0.25s ease both; }
.day-card:nth-child(1) { animation-delay: 0.04s; }
.day-card:nth-child(2) { animation-delay: 0.08s; }
.day-card:nth-child(3) { animation-delay: 0.12s; }
.day-card:nth-child(4) { animation-delay: 0.16s; }
.day-card:nth-child(5) { animation-delay: 0.20s; }
.day-card:nth-child(6) { animation-delay: 0.24s; }
.day-card:nth-child(7) { animation-delay: 0.28s; }
.day-card:nth-child(8) { animation-delay: 0.32s; }
.day-card:nth-child(9) { animation-delay: 0.36s; }

/* ══════════════════════════════════════════
   MOBILE  (≤ 768px)  — bottom-sheet layout
   ══════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Stack vertically: map on top, sheet slides up from bottom */
  .main {
    display: block;
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  /* MAP takes full screen behind the sheet */
  .map-wrap {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  #map { width: 100%; height: 100%; }

  /* BOTTOM SHEET */
  .sidebar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    border-right: none;
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
    /* default: peeking state */
    height: calc(var(--sheet-peek) + 20px);
    transition: height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .sidebar.sheet-open {
    height: 75vh;
  }
  .sidebar.sheet-full {
    height: calc(100vh - 56px); /* full minus header */
  }

  /* Drag pill handle */
  .sidebar-header {
    padding: 10px 18px 10px;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    background: var(--sand);
  }
  .sidebar-header::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: rgba(139,115,85,0.3);
    border-radius: 2px;
    margin: 0 auto 10px;
  }
  .sidebar-header h2 { font-size: 14px; }
  .sidebar-header p { display: none; } /* hide hint on mobile, use pill gesture */

  /* Scroll area inside sheet */
  .days-scroll {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(75vh - 60px);
  }
  .sidebar.sheet-full .days-scroll {
    max-height: calc(100vh - 56px - 60px);
  }

  /* Day cards: bigger tap targets */
  .day-header { padding: 14px 16px; gap: 12px; }
  .day-num { min-width: 44px; height: 44px; }
  .day-num .n { font-size: 18px; }
  .day-info h3 { font-size: 14px; }
  .day-chevron { margin-top: 15px; font-size: 13px; }

  /* Flight badge */
  .flight-badge { margin: 0 16px 10px; font-size: 11px; }

  /* Stops */
  .stops-list { padding: 0 16px 16px; }
  .stop-item { padding: 12px 4px; }
  .stop-name { font-size: 14px; }
  .stop-time { font-size: 12px; }
  .stop-note { font-size: 12px; }

  /* Links — bigger tap targets on mobile */
  .stop-link { padding: 7px 13px; font-size: 12px; }
  .stop-links { gap: 7px; margin-top: 9px; }

  /* Add stop button */
  .add-stop-btn { padding: 13px 16px; font-size: 14px; border-radius: 12px; }
  .add-stop-form { margin: 0 0 16px; }
  .add-stop-input { font-size: 16px; padding: 12px 14px; } /* 16px prevents iOS zoom */
  .add-stop-submit { padding: 12px 16px; font-size: 14px; }
  .add-stop-cancel { padding: 12px 14px; font-size: 14px; }
  .add-stop-status { font-size: 13px; }

  /* Legend repositioned above bottom sheet peek */
  .map-legend {
    bottom: calc(var(--sheet-peek) + 30px);
    left: 10px;
  }

  /* Larger popup links on mobile */
  .popup-link { padding: 7px 13px; font-size: 12px; }

  /* Delete buttons: bigger hit area */
  .custom-stop-delete, .stop-delete-btn {
    font-size: 20px; min-width: 36px; min-height: 36px;
  }

  /* Drag handle: larger */
  .drag-handle { font-size: 18px; padding-top: 6px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="header-flag">🇹🇷</span>
      <div>
        <div class="header-title">9 Days in <em>Turkey</em></div>
        <div class="header-sub">Apr 24 – May 2, 2026 · Cecilia's Trip</div>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="btn-en" class="lang-btn active" onclick="switchLang('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="switchLang('zh')">中文</button>
      </div>
      <script>(function(){var l=localStorage.getItem('turkey_lang');if(l==='zh'){document.getElementById('btn-en').className='lang-btn';document.getElementById('btn-zh').className='lang-btn active';}})()</script>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- SIDEBAR -->
    <div class="sidebar" id="bottom-sheet">
      <div class="sidebar-header" onclick="toggleSheet()">
        <h2>Daily Itinerary</h2>
        <p>Tap a day · tap a stop to zoom map</p>
      </div>
      <div class="days-scroll">
        <div id="days-container"></div>
      </div>
    </div>

    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <div class="legend-title">Cities</div>
        <div class="legend-item"><div class="legend-dot" style="background:#C4623A"></div>Istanbul</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B5E3C"></div>Cappadocia</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2E7D7A"></div>Antalya</div>
      </div>
    </div>

  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
// weather: pre-loaded Apr/May 2026 forecast — shown instantly & used as fallback
// if live API is unreachable (e.g. network restrictions). Live fetch will
// overwrite these values if it succeeds.

// ── LIVE WEATHER (Open-Meteo · free · no API key) ────────────────────────
// Fetches real forecast every time the page loads. Works up to 16 days ahead;
// switches to climate archive automatically for past dates.
const WEATHER_FETCH_CONFIG = [
  { days: [1,2,3],   lat: 41.0082, lng: 28.9784, dates: ["2026-04-24","2026-04-25","2026-04-26"] },
  { days: [4,5],     lat: 38.6407, lng: 34.8315, dates: ["2026-04-27","2026-04-28"] },
  { days: [6,7,8,9], lat: 36.8583, lng: 30.7325, dates: ["2026-04-29","2026-04-30","2026-05-01","2026-05-02"] },
];

function wmoToWeather(code, tmin, tmax) {
  const temp = `${Math.round(tmin)}–${Math.round(tmax)}°C`;
  if (code === 0)                        return { icon: "☀️",  note: "Clear & sunny",    temp };
  if (code === 1)                        return { icon: "🌤️", note: "Mainly clear",      temp };
  if (code === 2)                        return { icon: "⛅",  note: "Partly cloudy",     temp };
  if (code === 3)                        return { icon: "🌥️", note: "Overcast", note_zh: "阴天",           temp };
  if ([45,48].includes(code))            return { icon: "🌫️", note: "Foggy", note_zh: "有雾",             temp };
  if ([51,53,55].includes(code))         return { icon: "🌦️", note: "Light drizzle",     temp };
  if ([61,63,65].includes(code))         return { icon: "🌧️", note: "Rainy", note_zh: "下雨",             temp };
  if ([71,73,75].includes(code))         return { icon: "❄️",  note: "Snowy", note_zh: "下雪",             temp };
  if ([80,81,82].includes(code))         return { icon: "🌦️", note: "Rain showers",      temp };
  if ([95,96,99].includes(code))         return { icon: "⛈️",  note: "Thunderstorm", note_zh: "雷暴",      temp };
  return { icon: "🌤️", note: "Mixed conditions", temp };
}

function updateWeatherBadges() {
  DAYS.forEach(day => {
    const w = WEATHER[day.day];
    const card = document.getElementById(`day-card-${day.day}`);
    if (!card) return;
    const badge = card.querySelector('.weather-badge');
    if (badge) badge.innerHTML = `<span class="wi">${w.icon}</span>${w.temp} · ${LANG==='zh'&&w.note_zh ? w.note_zh : w.note}`;
  });
}

async function fetchLiveWeather() {
  const today = new Date().toISOString().split('T')[0];
  for (const cfg of WEATHER_FETCH_CONFIG) {
    try {
      const start = cfg.dates[0];
      const end   = cfg.dates[cfg.dates.length - 1];
      // Use archive API for fully past date ranges, forecast API otherwise
      const isPast = end < today;
      const base = isPast
        ? 'https://archive-api.open-meteo.com/v1/archive'
        : 'https://api.open-meteo.com/v1/forecast';
      // forecast_days=16 extends the horizon beyond the 7-day default (archive API doesn't support it)
      const url = `${base}?latitude=${cfg.lat}&longitude=${cfg.lng}`
        + `&daily=temperature_2m_max,temperature_2m_min,weathercode`
        + `&timezone=Europe%2FIstanbul`
        + `&start_date=${start}&end_date=${end}`
        + (isPast ? '' : '&forecast_days=16');
      const res  = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.reason || 'API error');
      cfg.days.forEach((dayNum, i) => {
        const code = data.daily.weathercode[i];
        const tmax = data.daily.temperature_2m_max[i];
        const tmin = data.daily.temperature_2m_min[i];
        if (code !== undefined && tmax !== null && tmin !== null) {
          WEATHER[dayNum] = wmoToWeather(code, tmin, tmax);
        } else {
          WEATHER[dayNum] = { icon: "❓", temp: "—", note: "No data for this date yet" };
        }
      });
    } catch(e) {
      console.warn('Live weather unavailable, using pre-loaded forecast:', e.message);
      // Keep the pre-loaded forecast data — no error shown to user
    }
  }
  updateWeatherBadges();
}

function applyLang() {
  document.title = ui('pageTitle');
  const headerTitle = document.querySelector('.header-title');
  if (headerTitle) headerTitle.innerHTML = ui('headerTitle');
  const headerSub = document.querySelector('.header-sub');
  if (headerSub) headerSub.textContent = ui('headerSub');
  const sidebarH2 = document.querySelector('.sidebar-header h2');
  if (sidebarH2) sidebarH2.textContent = ui('sidebarTitle');
  const sidebarP = document.querySelector('.sidebar-header p');
  if (sidebarP) sidebarP.textContent = ui('sidebarHint');
  const legendTitle = document.querySelector('.legend-title');
  if (legendTitle) legendTitle.textContent = ui('legendTitle');
  const btnEn = document.getElementById('btn-en');
  const btnZh = document.getElementById('btn-zh');
  if (btnEn) btnEn.className = 'lang-btn' + (LANG==='en'?' active':'');
  if (btnZh) btnZh.className = 'lang-btn' + (LANG==='zh'?' active':'');

  // Update each day card in-place (preserves custom stops & open state)
  DAYS.forEach(day => {
    const card = document.getElementById(`day-card-${day.day}`);
    if (!card) return;
    const h3 = card.querySelector('.day-info h3');
    if (h3) h3.textContent = t(day, 'title');
    const dateEl = card.querySelector('.day-info .date');
    if (dateEl) dateEl.textContent = t(day, 'date');
    const cityEl = card.querySelector('.city-tag');
    if (cityEl) cityEl.textContent = t(day, 'city');
    const dayLabel = card.querySelector('.day-num .label');
    if (dayLabel) dayLabel.textContent = ui('day');
    // Update builtin stop names/notes/warns
    const builtinStops = card.querySelectorAll('.stop-item[data-type="builtin"]');
    builtinStops.forEach(el => {
      const idx = parseInt(el.dataset.idx);
      const stop = day.stops[idx];
      if (!stop) return;
      const nameEl = el.querySelector('.stop-name');
      if (nameEl) nameEl.textContent = nameEl.textContent.includes('🏨') ? (t(stop,'name')) : t(stop,'name');
      const noteEl = el.querySelector('.stop-note');
      if (noteEl) {
        // Always restore the correct-language original note first;
        // updateBuiltinTransportNotes (below) will override for in-session reordered days
        noteEl.textContent = t(stop, 'note');
        noteEl.style.color = '';
      }
      const warnEl = el.querySelector('.stop-warn');
      if (warnEl) warnEl.textContent = '⚠️ ' + t(stop,'warn');
      // Update link labels
      el.querySelectorAll('.stop-link').forEach(a => {
        const ltype = a.className.replace('stop-link','').trim();
        const link = (stop.links||[]).find(l => l.type === ltype);
        if (link) a.textContent = t(link,'label');
      });
    });
    // Update add-stop button
    const addBtn = card.querySelector('.add-stop-btn');
    if (addBtn) addBtn.textContent = ui('addStop');
  });

  updateWeatherBadges();

  // Update flight badges
  DAYS.forEach(day => {
    const card = document.getElementById(`day-card-${day.day}`);
    if (!card) return;
    const fb = card.querySelector('.flight-badge');
    const flightStr = t(day, 'flight');
    if (fb && flightStr) {
      fb.innerHTML = flightStr.split('\n').map(l => `<div>${l}</div>`).join('');
    }
  });

  // Update custom stop labels (badge, maps button) and transport notes
  document.querySelectorAll('.custom-stop-item').forEach(el => {
    const badge = el.querySelector('.custom-badge');
    if (badge) badge.textContent = ui('customBadge');
    const mapsLink = el.querySelector('.custom-maps-link');
    if (mapsLink) mapsLink.textContent = ui('mapsBtn');
  });

  // Re-run transport notes for days with custom stops
  const allDayNums = new Set(
    Array.from(document.querySelectorAll('.custom-stop-item'))
      .map(el => parseInt(el.dataset.day))
      .filter(Boolean)
  );
  allDayNums.forEach(dayNum => redrawCustomPolylines(dayNum));

  // Re-apply computed transport notes for any days reordered this session (language-dependent)
  reorderedInSession.forEach(dayNum => updateBuiltinTransportNotes(dayNum));
}



function updateWeatherBadges() {
  const badge = document.getElementById('weather-badge');
  if (!badge) return;
  const w = (LANG === 'zh' ? WEATHER_ZH : WEATHER)[1] || { icon: '🌤️', temp: '—', note: '' };
  badge.textContent = `${w.icon} ${w.temp}`;
}

function toggleDay(dayNum) {
  const card = document.getElementById(`day-card-${dayNum}`);
  if (activeDay === dayNum) {
    card.classList.remove('active');
    activeDay = null;
    map.fitBounds(allCoords, { padding: [40, 40], animate: true });
    allPolylines.forEach(({ poly }) => poly.setStyle({ opacity: 0.55, weight: 2.5 }));
    allMarkers.forEach(({ marker }) => marker.setOpacity(1));
    return;
  }
  ensureSheetOpen();
  if (activeDay !== null) document.getElementById(`day-card-${activeDay}`)?.classList.remove('active');
  card.classList.add('active');
  activeDay = dayNum;

  const day = DAYS.find(d => d.day === dayNum);
  const coords = day.stops.map(s => [s.lat, s.lng]);
  if (coords.length === 1) map.setView(coords[0], 13, { animate: true, duration: 0.7 });
  else map.fitBounds(coords, { padding: [60, 60], animate: true, duration: 0.7 });

  allPolylines.forEach(({ poly, day: d }) =>
    poly.setStyle({ opacity: d === dayNum ? 0.9 : 0.08, weight: d === dayNum ? 3.5 : 1.5 }));
  allMarkers.forEach(({ marker, day: d }) =>
    marker.setOpacity(d === dayNum ? 1 : 0.2));
}

// ── Mobile bottom sheet ───────────────────────────────────────────────────
const isMobile = () => window.innerWidth <= 768;
let sheetState = 'peek'; // 'peek' | 'open' | 'full'

function toggleSheet() {
  if (!isMobile()) return;
  const sheet = document.getElementById('bottom-sheet');
  if (sheetState === 'peek') {
    sheetState = 'open';
    sheet.classList.add('sheet-open');
    sheet.classList.remove('sheet-full');
  } else if (sheetState === 'open') {
    sheetState = 'full';
    sheet.classList.add('sheet-open', 'sheet-full');
  } else {
    sheetState = 'peek';
    sheet.classList.remove('sheet-open', 'sheet-full');
  }
}

// When user taps a day on mobile, open sheet to 'open' state automatically
function ensureSheetOpen() {
  if (!isMobile()) return;
  const sheet = document.getElementById('bottom-sheet');
  if (sheetState === 'peek') {
    sheetState = 'open';
    sheet.classList.add('sheet-open');
    sheet.classList.remove('sheet-full');
  }
}

let activeDay = null;
// Tracks days that have been drag-reordered in THIS browser session (not persisted)
const reorderedInSession = new Set();

function toggleDay(dayNum) {
  const card = document.getElementById(`day-card-${dayNum}`);
  if (activeDay === dayNum) {
    card.classList.remove('active');
    activeDay = null;
    map.fitBounds(allCoords, { padding: [40, 40], animate: true });
    allPolylines.forEach(({ poly }) => poly.setStyle({ opacity: 0.55, weight: 2.5 }));
    allMarkers.forEach(({ marker }) => marker.setOpacity(1));
    return;
  }
  ensureSheetOpen();
  if (activeDay !== null) document.getElementById(`day-card-${activeDay}`)?.classList.remove('active');
  card.classList.add('active');
  activeDay = dayNum;

  const day = DAYS.find(d => d.day === dayNum);
  const coords = day.stops.map(s => [s.lat, s.lng]);
  if (coords.length === 1) map.setView(coords[0], 13, { animate: true, duration: 0.7 });
  else map.fitBounds(coords, { padding: [60, 60], animate: true, duration: 0.7 });

  allPolylines.forEach(({ poly, day: d }) =>
    poly.setStyle({ opacity: d === dayNum ? 0.9 : 0.08, weight: d === dayNum ? 3.5 : 1.5 }));
  allMarkers.forEach(({ marker, day: d }) =>
    marker.setOpacity(d === dayNum ? 1 : 0.2));
}

function flyToStop(lat, lng, dayNum) {
  map.setView([lat, lng], 15, { animate: true, duration: 0.6 });
  const found = allMarkers.find(m => Math.abs(m.stop.lat - lat) < 0.0001 && m.day === dayNum);
  if (found) found.marker.openPopup();
}

const CUSTOM_COLOR = '#7B5EA7';
const customMapData = {}; // dayNum → { marker, polyline }[]

// ── Storage ───────────────────────────────────────────────────────────────
function loadCustomStops() {
  try { return JSON.parse(localStorage.getItem('turkey_custom_stops') || '{}'); }
  catch { return {}; }
}
function saveCustomStops(data) {
  localStorage.setItem('turkey_custom_stops', JSON.stringify(data));
}

// ── Map helpers ───────────────────────────────────────────────────────────
function makeCustomIcon() {
  return L.divIcon({
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 2C7.4 2 2 7.4 2 14c0 8 12 22 12 22s12-14 12-22C26 7.4 20.6 2 14 2z"
        fill="${CUSTOM_COLOR}" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.35))"/>
      <circle cx="14" cy="14" r="6" fill="white" opacity="0.92"/>
      <text x="14" y="18" text-anchor="middle" font-size="9" fill="${CUSTOM_COLOR}">✦</text>
    </svg>`,
    iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -38], className: ''
  });
}

// Build coord+name list by reading the ACTUAL DOM order of stops in the list
function getOrderedStopCoords(dayNum) {
  const stopsList = document.getElementById(`stops-list-${dayNum}`);
  if (!stopsList) return [];
  const day = DAYS.find(d => d.day === dayNum);
  const customData = loadCustomStops();
  const customs = {};
  (customData[dayNum] || []).forEach(s => { customs[s.id] = s; });

  const results = [];
  stopsList.querySelectorAll('.draggable-stop').forEach(el => {
    if (el.style.display === 'none') return; // skip hidden stops
    if (el.dataset.type === 'builtin') {
      const idx = parseInt(el.dataset.idx);
      if (day && day.stops[idx]) {
        const s = day.stops[idx];
        results.push({ lat: s.lat, lng: s.lng, name: s.name, type: 'builtin', el });
      }
    } else if (el.dataset.type === 'custom') {
      const s = customs[el.dataset.id];
      if (s && s.lat && s.lng) {
        results.push({ lat: s.lat, lng: s.lng, name: s.name, id: s.id, type: 'custom', el });
      }
    }
  });
  return results;
}

function redrawCustomPolylines(dayNum) {
  // Remove old custom polylines for this day
  if (!customMapData[dayNum]) customMapData[dayNum] = [];
  customMapData[dayNum].forEach(d => { if (d.polyline) map.removeLayer(d.polyline); });
  customMapData[dayNum] = customMapData[dayNum].filter(d => d.marker);

  // Also update the built-in polyline for this day to include custom stops in order
  const dayPoly = allPolylines.find(p => p.day === dayNum);
  const ordered = getOrderedStopCoords(dayNum);
  if (ordered.length < 2) return;

  const coords = ordered.map(s => [s.lat, s.lng]);

  // Update the built-in day polyline to reflect new full route
  if (dayPoly) {
    dayPoly.poly.setLatLngs(coords);
  } else {
    // Create a new polyline if none exists (e.g. day had only 1 stop)
    const day = DAYS.find(d => d.day === dayNum);
    const color = day ? day.color : CUSTOM_COLOR;
    const poly = L.polyline(coords, { color, weight: 2.5, opacity: 0.7, dashArray: '5,5' }).addTo(map);
    allPolylines.push({ poly, day: dayNum });
  }

  // Update transport note on each custom stop based on its actual predecessor in DOM order
  for (let i = 0; i < ordered.length; i++) {
    const s = ordered[i];
    if (s.type !== 'custom' || !s.el) continue;
    const prev = ordered[i - 1];
    let transportText = '';
    if (prev) {
      const dist = Math.round(calcDistKm(prev.lat, prev.lng, s.lat, s.lng) * 10) / 10;
      const prevShortName = prev.name.split(/[,(]/)[0].trim();
      transportText = `${ui('distFrom')(dist, prevShortName)} · ${ui('taxiOrWalk')}`;
    }
    // Update the transport line in the sidebar card
    const transportEl = s.el.querySelector('.custom-transport-note');
    if (transportEl) {
      transportEl.textContent = transportText ? `🚶 ${transportText}` : '';
      transportEl.style.display = transportText ? '' : 'none';
    }
    // Update in localStorage too
    const data = loadCustomStops();
    const entry = (data[dayNum] || []).find(c => c.id === s.id);
    if (entry) {
      entry.transport = transportText;
      saveCustomStops(data);
    }
  }
}

function addCustomMarkerToMap(dayNum, stop) {
  if (!stop.lat || !stop.lng) return;
  if (!customMapData[dayNum]) customMapData[dayNum] = [];
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name)}`;
  const marker = L.marker([stop.lat, stop.lng], { icon: makeCustomIcon() })
    .addTo(map)
    .bindPopup(`
      <div class="popup-title">${stop.name}</div>
      <div class="popup-time">Day ${dayNum} · Custom Stop · ✦</div>
      <div class="popup-note">${stop.transport || 'Custom stop added by you.'}</div>
      <div class="popup-links">
        <a class="popup-link" href="${mapsUrl}" target="_blank">📍 Google Maps</a>
      </div>
    `, { maxWidth: 270 });
  customMapData[dayNum].push({ marker, id: stop.id });
}

function removeCustomMarkerFromMap(dayNum, stopId) {
  // Search the specified day first, then all other days as fallback
  // (guards against dayNum mismatches and strict type mismatches on id)
  const sid = String(stopId);
  const searchOrder = [dayNum, ...Object.keys(customMapData).map(Number).filter(d => d !== dayNum)];
  for (const d of searchOrder) {
    if (!customMapData[d]) continue;
    const idx = customMapData[d].findIndex(e => String(e.id) === sid);
    if (idx !== -1) {
      if (customMapData[d][idx].marker) map.removeLayer(customMapData[d][idx].marker);
      customMapData[d].splice(idx, 1);
      return;
    }
  }
}

// ── Universal drag — works for ALL .draggable-stop elements ───────────────
// ── DYNAMIC TIME REASSIGNMENT ─────────────────────────────────────────────────
// After any drag-and-drop reorder, redistribute times chronologically
// so the earliest time always goes to the top stop, latest to the bottom.
function reassignTimesChronologically(dayNum) {
  const stopsList = document.getElementById(`stops-list-${dayNum}`);
  if (!stopsList) return;
  const day = DAYS.find(d => d.day === dayNum);
  if (!day) return;

  // Collect all visible non-hotel builtin stops in current DOM order
  const entries = [];
  stopsList.querySelectorAll('.draggable-stop').forEach(el => {
    if (el.style.display === 'none') return;
    if (el.dataset.type !== 'builtin') return;
    const idx = parseInt(el.dataset.idx);
    const stop = day.stops[idx];
    if (!stop || stop.isHotel) return;
    const timeEl = el.querySelector('.stop-time');
    const t = timeEl ? timeEl.textContent.trim() : '';
    if (t && /^\d{1,2}:\d{2}$/.test(t)) entries.push({ el, timeEl, idx });
  });

  if (entries.length < 2) return;

  // Gather original times from DAYS data + any stored overrides
  const data = loadCustomStops();
  const stored = data[`times_${dayNum}`] || {};
  const times = entries.map(e => stored[e.idx] || day.stops[e.idx].time || '');

  // Sort chronologically
  const sorted = [...times].filter(Boolean).sort((a, b) => {
    const [ah, am] = a.split(':').map(Number);
    const [bh, bm] = b.split(':').map(Number);
    return (ah * 60 + am) - (bh * 60 + bm);
  });

  // Reassign in current order
  const newMap = {};
  entries.forEach((e, i) => {
    const t = sorted[i] || times[i];
    e.timeEl.textContent = t;
    newMap[e.idx] = t;
  });

  // Persist so reload restores the reassigned times
  data[`times_${dayNum}`] = newMap;
  saveCustomStops(data);
}

// ── DYNAMIC BUILTIN TRANSPORT NOTES ──────────────────────────────────────────
// After drag reorder, replace each builtin stop's note text with a computed
// distance from its actual predecessor in the new DOM order.
// Only called for days in reorderedInSession (cleared on page reload).
function updateBuiltinTransportNotes(dayNum) {
  const day = DAYS.find(d => d.day === dayNum);
  if (!day) return;

  const ordered = getOrderedStopCoords(dayNum);
  if (ordered.length < 2) return;

  for (let i = 0; i < ordered.length; i++) {
    const s = ordered[i];
    if (s.type !== 'builtin' || !s.el) continue;
    const idx = parseInt(s.el.dataset.idx);
    const stop = day.stops[idx];
    if (!stop || stop.isHotel) continue; // hotel stops keep their original note

    const noteEl = s.el.querySelector('.stop-note');
    if (!noteEl) continue;

    // Find nearest visible predecessor with coordinates
    let prev = null;
    for (let j = i - 1; j >= 0; j--) {
      if (ordered[j].lat && ordered[j].lng) { prev = ordered[j]; break; }
    }

    if (prev && s.lat && s.lng) {
      const dist = Math.round(calcDistKm(prev.lat, prev.lng, s.lat, s.lng) * 10) / 10;
      const prevShortName = prev.name.split(/[,(]/)[0].trim();
      const transportText = `${ui('distFrom')(dist, prevShortName)} · ${ui('taxiOrWalk')}`;
      noteEl.textContent = `🚶 ${transportText}`;
      noteEl.style.color = 'var(--teal)';
    } else {
      // First visible stop — restore original note
      noteEl.textContent = LANG === 'zh' ? (noteEl.dataset.zh || noteEl.dataset.en || '') : (noteEl.dataset.en || '');
      noteEl.style.color = '';
    }
  }
}

// Apply stored time overrides on page load (call after order is restored)
function applyStoredTimeOverrides(dayNum) {
  const data = loadCustomStops();
  const stored = data[`times_${dayNum}`];
  if (!stored) return;
  const stopsList = document.getElementById(`stops-list-${dayNum}`);
  if (!stopsList) return;
  const day = DAYS.find(d => d.day === dayNum);
  if (!day) return;
  stopsList.querySelectorAll('.draggable-stop[data-type="builtin"]').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    if (stored[idx] !== undefined) {
      const timeEl = el.querySelector('.stop-time');
      if (timeEl) timeEl.textContent = stored[idx];
    }
  });
}

function initDrag(el, dayNum) {
  const handle = el.querySelector('.drag-handle');
  if (!handle) return;

  handle.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e); });
  handle.addEventListener('touchstart', (e) => startDrag(e.touches[0]), { passive: true });

  function startDrag(e) {
    const stopsList = document.getElementById(`stops-list-${dayNum}`);
    if (!stopsList) return;

    const rect = el.getBoundingClientRect();
    const startY = e.clientY;
    const offsetY = e.clientY - rect.top;

    // Ghost: fixed-positioned floating copy
    const ghost = el.cloneNode(true);
    ghost.style.cssText = `
      position:fixed; left:${rect.left}px; top:${rect.top}px;
      width:${rect.width}px; pointer-events:none; z-index:99999;
      opacity:0.93; background:#FAF6EE;
      box-shadow:0 10px 32px rgba(0,0,0,0.28); border-radius:10px;
      user-select:none;
    `;
    document.body.appendChild(ghost);

    // Placeholder in the list
    const ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.cssText = `height:${rect.height}px; background:rgba(123,94,167,0.09);
      border:2px dashed rgba(123,94,167,0.5); border-radius:8px; margin:2px 0;`;
    el.style.opacity = '0.15';

    function getStops() {
      return [...stopsList.querySelectorAll('.draggable-stop')].filter(s => s !== el);
    }

    function updatePosition(clientY) {
      ghost.style.top = `${clientY - offsetY}px`;

      const ghostMid = clientY - offsetY + rect.height / 2;
      const siblings = getStops();
      let inserted = false;

      for (const sib of siblings) {
        const r = sib.getBoundingClientRect();
        if (ghostMid < r.top + r.height / 2) {
          if (ph.nextSibling !== sib) sib.parentNode.insertBefore(ph, sib);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        const addBtn = stopsList.querySelector('.add-stop-btn');
        if (ph.nextSibling !== addBtn) stopsList.insertBefore(ph, addBtn);
      }
    }

    // Insert placeholder after el initially
    el.after(ph);
    updatePosition(startY);

    function onMouseMove(ev) { updatePosition(ev.clientY); }
    function onTouchMove(ev) { updatePosition(ev.touches[0].clientY); }

    function onEnd() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onTouchMove);
      document.removeEventListener('touchend', onEnd);
      document.body.classList.remove('is-dragging');
      ghost.remove();
      el.style.opacity = '';
      ph.replaceWith(el);

      // Save full interleaved order: [{type:'builtin',idx:N} | {type:'custom',id:'...'}]
      const allStops = [...stopsList.querySelectorAll('.draggable-stop')];
      const fullOrder = allStops.map(s => s.dataset.type === 'custom'
        ? { type: 'custom', id: s.dataset.id }
        : { type: 'builtin', idx: parseInt(s.dataset.idx) }
      );
      const data = loadCustomStops();
      if (!data[dayNum]) data[dayNum] = [];
      // Also re-save custom stops array in their new order
      const customInOrder = allStops
        .filter(s => s.dataset.type === 'custom')
        .map(s => (data[dayNum] || []).find(c => c.id === s.dataset.id))
        .filter(Boolean);
      data[dayNum] = customInOrder;
      data[`order_${dayNum}`] = fullOrder;
      saveCustomStops(data);

      redrawCustomPolylines(dayNum);
      reassignTimesChronologically(dayNum);
      reorderedInSession.add(dayNum);
      updateBuiltinTransportNotes(dayNum);
    }

    document.body.classList.add('is-dragging');
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onTouchMove, { passive: true });
    document.addEventListener('touchend', onEnd);
  }
}

// Hide a built-in stop (soft delete — just visually removes it, triggers route redraw)
function hideBuiltinStop(btn) {
  const el = btn.closest('.draggable-stop');
  const dayNum = parseInt(el.dataset.day);
  el.style.display = 'none';
  redrawCustomPolylines(dayNum);
}

// ── Add / delete ──────────────────────────────────────────────────────────
function openAddStop(dayNum) {
  const card = document.getElementById(`day-card-${dayNum}`);
  if (!card.classList.contains('active')) toggleDay(dayNum);
  const form = document.getElementById(`add-stop-form-${dayNum}`);
  form.classList.add('open');
  setTimeout(() => document.getElementById(`add-stop-input-${dayNum}`).focus(), 60);
}

function closeAddStop(dayNum) {
  document.getElementById(`add-stop-form-${dayNum}`).classList.remove('open');
  const inp = document.getElementById(`add-stop-input-${dayNum}`);
  if (inp) inp.value = '';
  const coords = document.getElementById(`add-stop-coords-${dayNum}`);
  if (coords) coords.value = '';
  const status = document.getElementById(`add-stop-status-${dayNum}`);
  if (status) { status.textContent = ''; status.className = 'add-stop-status'; }
  const btn = document.getElementById(`add-stop-btn-${dayNum}`);
  if (btn) { btn.textContent = '＋ Add'; btn.disabled = false; }
  const coordsRow = document.getElementById(`add-stop-coords-row-${dayNum}`);
  if (coordsRow) coordsRow.style.display = 'none';
}

// Detect if text is a Google Maps short URL
function isShortMapsUrl(text) {
  return /maps\.app\.goo\.gl|goo\.gl\/maps/i.test(text);
}

// Parse coords from "lat, lng" string OR a Google Maps URL
function parseCoordsFromInput(text) {
  text = text.trim();
  // All Google Maps URL formats:
  // !3d41.006749!4d28.9724282  (most reliable — embedded in place URLs)
  // @41.006749,28.9724282
  // q=41.006749,28.9724282
  // ll=41.006749,28.9724282
  const patterns = [
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/,
    /\/(-?\d+\.\d+),(-?\d+\.\d+)(?:,|\?|$)/,
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      // Sanity check: valid lat/lng range
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
        return { lat, lng };
      }
    }
  }
  // Plain "lat, lng" or "lat lng"
  const m = text.match(/^(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)$/);
  if (m) {
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return { lat, lng };
  }
  return null;
}

// Is this coordinate inside Turkey?
function inTurkey(lat, lng) {
  return lat >= 35.5 && lat <= 42.5 && lng >= 25.5 && lng <= 45;
}

// City context per day number
const DAY_CITY_CONTEXT = {
  1: 'Istanbul', 2: 'Istanbul', 3: 'Istanbul',
  4: 'Cappadocia', 5: 'Cappadocia',
  6: 'Antalya', 7: 'Antalya', 8: 'Antalya', 9: 'Antalya'
};

// Try multiple geocoding sources — ONLY return results inside Turkey
async function geocodePlace(name, dayNum) {
  const city = DAY_CITY_CONTEXT[dayNum] || 'Turkey';
  // Build queries: most specific first (city), then fallback to all Turkey
  const queries = [
    `${name}, ${city}, Turkey`,
    `${name}, Turkey`,
  ];
  // Add neighbouring city fallbacks
  if (city === 'Istanbul') queries.push(`${name}, Beyoğlu, Turkey`, `${name}, Sultanahmet, Turkey`);
  if (city === 'Cappadocia') queries.push(`${name}, Göreme, Turkey`, `${name}, Nevşehir, Turkey`);
  if (city === 'Antalya') queries.push(`${name}, Kaleiçi, Turkey`, `${name}, Lara, Antalya, Turkey`);

  for (const q of queries) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=tr`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const results = await res.json();
      // STRICT: only accept results provably inside Turkey
      const pick = results.find(r => inTurkey(parseFloat(r.lat), parseFloat(r.lon)));
      if (pick) return {
        lat: parseFloat(pick.lat), lng: parseFloat(pick.lon),
        shortAddr: pick.display_name.split(',').slice(0, 3).join(','),
      };
    } catch(e) {}
  }
  return null; // Nothing found — show manual fallback
}

function buildTransportNote(dayNum, lat, lng) {
  const day = DAYS.find(d => d.day === dayNum);
  const data = loadCustomStops();
  const prevCustoms = (data[dayNum] || []);
  const prevStop = prevCustoms.length > 0 && prevCustoms[prevCustoms.length-1].lat
    ? prevCustoms[prevCustoms.length-1]
    : (day && day.stops.length > 0 ? day.stops[day.stops.length-1] : null);
  if (!prevStop) return '';
  const dist = Math.round(calcDistKm(prevStop.lat, prevStop.lng, lat, lng) * 10) / 10;
  const prevName = prevStop.name.split(/[,(]/)[0].trim();
  return `${ui('distFrom')(dist, prevName)} · ${ui('taxiOrWalk')}`;
}

function finaliseStop(dayNum, name, lat, lng, shortAddr) {
  const transport = (lat && lng) ? buildTransportNote(dayNum, lat, lng) : '';
  const stop = { id: Date.now().toString(), name, lat, lng, shortAddr, transport };
  const data = loadCustomStops();
  if (!data[dayNum]) data[dayNum] = [];
  data[dayNum].push(stop);
  saveCustomStops(data);
  renderCustomStop(dayNum, stop);
  if (lat && lng) {
    addCustomMarkerToMap(dayNum, stop);
    redrawCustomPolylines(dayNum);
    map.setView([lat, lng], 15, { animate: true, duration: 0.7 });
  }
  return stop;
}

async function submitAddStop(dayNum) {
  const inp = document.getElementById(`add-stop-input-${dayNum}`);
  const btn = document.getElementById(`add-stop-btn-${dayNum}`);
  const status = document.getElementById(`add-stop-status-${dayNum}`);
  const coordsRow = document.getElementById(`add-stop-coords-row-${dayNum}`);
  let text = inp ? inp.value.trim() : '';
  if (!text) return;

  // If it's a short URL, tell user to use the full URL instead
  if (isShortMapsUrl(text)) {
    if (status) { status.className = 'add-stop-status error'; status.textContent = '⚠️ Short links don\'t work — paste the full URL from the address bar instead.'; }
    if (coordsRow) coordsRow.style.display = 'block';
    return;
  }

  // Check if they pasted a full Google Maps URL or plain coords
  const directCoords = parseCoordsFromInput(text);
  if (directCoords) {
    // Try to extract a human-readable name from the URL (e.g. /place/Hidden+Garden+...)
    let placeName = inp ? inp.value.trim() : 'Custom Stop';
    const placeMatch = text.match(/\/place\/([^/@]+)/);
    if (placeMatch) placeName = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
    if (status) { status.className = 'add-stop-status success'; status.textContent = `📍 Pinning: ${placeName}`; }
    finaliseStop(dayNum, placeName, directCoords.lat, directCoords.lng,
      `${directCoords.lat.toFixed(5)}, ${directCoords.lng.toFixed(5)}`);
    setTimeout(() => closeAddStop(dayNum), 1200);
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  if (status) { status.className = 'add-stop-status'; status.textContent = '🔍 Searching…'; }

  const geo = await geocodePlace(text, dayNum);

  if (geo) {
    finaliseStop(dayNum, text, geo.lat, geo.lng, geo.shortAddr);
    if (status) { status.className = 'add-stop-status success'; status.textContent = `✓ Found · ${geo.shortAddr.split(',')[0]}`; }
    setTimeout(() => closeAddStop(dayNum), 1400);
  } else {
    // Not found — show the coords fallback
    if (btn) { btn.disabled = false; btn.textContent = '＋ Add'; }
    if (status) {
      status.className = 'add-stop-status error';
      status.textContent = `⚠️ "${text}" not found automatically.`;
    }
    if (coordsRow) coordsRow.style.display = 'block';
    if (gmapsLink) {
      gmapsLink.href = `https://www.google.com/maps/search/${encodeURIComponent(text)}+istanbul`;
    }
    // Still add to list without coords so name is saved
    // (user can pin it via coords row)
  }
}

async function submitWithCoords(dayNum) {
  const inp = document.getElementById(`add-stop-input-${dayNum}`);
  const coordsInp = document.getElementById(`add-stop-coords-${dayNum}`);
  const status = document.getElementById(`add-stop-status-${dayNum}`);
  const name = inp ? inp.value.trim() : 'Custom Stop';
  let coordText = coordsInp ? coordsInp.value.trim() : '';
  if (!coordText) {
    if (status) { status.className = 'add-stop-status error'; status.textContent = '⚠️ Please paste a full Maps URL or coordinates.'; }
    return;
  }

  // Reject short URLs clearly
  if (isShortMapsUrl(coordText)) {
    if (status) { status.className = 'add-stop-status error'; status.textContent = '⚠️ Short links don\'t work — use the full URL from the address bar, or paste coordinates.'; }
    return;
  }

  // 1. Try parsing as coords or full Google Maps URL
  const parsed = parseCoordsFromInput(coordText);
  if (parsed) {
    finaliseStop(dayNum, name, parsed.lat, parsed.lng,
      `${parsed.lat.toFixed(5)}, ${parsed.lng.toFixed(5)}`);
    if (status) { status.className = 'add-stop-status success'; status.textContent = `✓ Pinned on map!`; }
    setTimeout(() => closeAddStop(dayNum), 1200);
    return;
  }

  // 2. Treat it as an address — geocode it
  if (status) { status.className = 'add-stop-status'; status.textContent = '🔍 Looking up address…'; }
  try {
    const city = DAY_CITY_CONTEXT[dayNum] || 'Turkey';
    // Try with city appended, then raw
    const queries = [`${coordText}, ${city}, Turkey`, `${coordText}, Turkey`, coordText];
    let geo = null;
    for (const q of queries) {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=tr`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const results = await res.json();
      const pick = results.find(r => inTurkey(parseFloat(r.lat), parseFloat(r.lon)));
      if (pick) { geo = pick; break; }
    }
    if (geo) {
      const lat = parseFloat(geo.lat), lng = parseFloat(geo.lon);
      const shortAddr = geo.display_name.split(',').slice(0, 3).join(',');
      finaliseStop(dayNum, name, lat, lng, shortAddr);
      if (status) { status.className = 'add-stop-status success'; status.textContent = `✓ Found · ${shortAddr.split(',')[0]}`; }
      setTimeout(() => closeAddStop(dayNum), 1400);
      return;
    }
  } catch(e) {}

  if (status) { status.className = 'add-stop-status error'; status.textContent = '⚠️ Could not find that address. Try a Google Maps share link or coordinates.'; }
}

function deleteCustomStop(dayNum, stopId) {
  const sid = String(stopId);
  document.getElementById(`custom-stop-${sid}`)?.remove();
  removeCustomMarkerFromMap(dayNum, stopId);
  // Clean from localStorage — search all days in case dayNum is off
  const data = loadCustomStops();
  let changed = false;
  Object.keys(data).forEach(key => {
    if (Array.isArray(data[key])) {
      const before = data[key].length;
      data[key] = data[key].filter(s => String(s.id) !== sid);
      if (data[key].length !== before) changed = true;
    }
  });
  if (changed) saveCustomStops(data);
  redrawCustomPolylines(dayNum);
}

// ── Haversine distance ────────────────────────────────────────────────────
function calcDistKm(lat1, lng1, lat2, lng2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Init on page load ─────────────────────────────────────────────────────
(function initCustomStops() {
  const data = loadCustomStops();

  // First pass: add all custom stops and markers
  Object.entries(data).forEach(([key, val]) => {
    if (key.startsWith('order_')) return; // skip order keys
    const dayNum = parseInt(key);
    val.forEach(stop => {
      renderCustomStop(dayNum, stop);
      if (stop.lat && stop.lng) addCustomMarkerToMap(dayNum, stop);
    });
  });

  // Second pass: restore saved interleaved order for each day
  Object.entries(data).forEach(([key, order]) => {
    if (!key.startsWith('order_')) return;
    const dayNum = parseInt(key.replace('order_', ''));
    const stopsList = document.getElementById(`stops-list-${dayNum}`);
    if (!stopsList) return;
    const addBtn = stopsList.querySelector('.add-stop-btn');
    const addForm = stopsList.querySelector('.add-stop-form');

    // Rebuild the stop list in saved order
    order.forEach(entry => {
      let el;
      if (entry.type === 'builtin') {
        el = stopsList.querySelector(`.draggable-stop[data-type="builtin"][data-idx="${entry.idx}"]`);
      } else {
        el = document.getElementById(`custom-stop-${entry.id}`);
      }
      if (el) stopsList.insertBefore(el, addBtn);
    });
  });

  // Third pass: redraw polylines for all days that have custom stops
  const dayNums = new Set(
    Object.keys(data)
      .filter(k => !k.startsWith('order_'))
      .map(k => parseInt(k))
  );
  dayNums.forEach(dayNum => redrawCustomPolylines(dayNum));
  dayNums.forEach(dayNum => applyStoredTimeOverrides(dayNum));
  // Note: updateBuiltinTransportNotes is NOT called here on load — computed transport notes
  // only appear live after a drag in the current session (tracked by reorderedInSession).
})();

// 🌏 Apply saved language on load
applyLang();

// 🌤 Kick off live weather fetch on every page load
fetchLiveWeather();
